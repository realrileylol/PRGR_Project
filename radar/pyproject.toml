[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "prgr-radar"
version = "0.1.0"
description = "Radar subsystem for PRGR Launch Monitor (OPS243-A + K-LD7)"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}

dependencies = [
    "pyserial>=3.5",
    "numpy>=1.20.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
prgr-radar-bridge = "openflight.bridge:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
