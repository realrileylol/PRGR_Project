name: CI

on:
  push:
    branches:
      - 'claude/**'
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Enforce conventional commit title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|refactor|test|chore|perf|build|ci)(\(.+\))?!?:\s.+/;
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" does not follow conventional commit format.\n` +
                `Expected: <type>(<optional scope>): <description>\n` +
                `Allowed types: feat, fix, docs, refactor, test, chore, perf, build, ci`
              );
            }

  cpp-build:
    name: C++ build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for C++ / build changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'include/**'
              - 'screens/**'
              - 'CMakeLists.txt'
              - '**/*.qrc'
              - '.github/workflows/**'

      - name: Install Qt 6 + OpenCV + build tools
        if: steps.filter.outputs.cpp == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qml6-module-qtquick-controls libopencv-dev \
            cmake ninja-build build-essential

      - name: Configure (CMake)
        if: steps.filter.outputs.cpp == 'true'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.filter.outputs.cpp == 'true'
        run: cmake --build build -j

      - name: Skip (no C++ changes)
        if: steps.filter.outputs.cpp != 'true'
        run: echo "No C++/CMake files changed — skipping C++ build."

  python-tests:
    name: Python tests (radar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for radar changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            radar:
              - 'radar/**'

      - name: Set up Python
        if: steps.filter.outputs.radar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and run tests
        if: steps.filter.outputs.radar == 'true'
        run: |
          cd radar
          pip install -e .
          pip install pytest
          pytest

      - name: Skip (no radar changes)
        if: steps.filter.outputs.radar != 'true'
        run: echo "No radar/ files changed — skipping Python tests."

  python-lint:
    name: Python lint (radar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for radar changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            radar:
              - 'radar/**'

      - name: Set up Python
        if: steps.filter.outputs.radar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ruff linter
        if: steps.filter.outputs.radar == 'true'
        run: |
          pip install ruff
          cd radar
          ruff check .

      - name: Skip (no radar changes)
        if: steps.filter.outputs.radar != 'true'
        run: echo "No radar/ files changed — skipping Python lint."
