<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRGR Launch Monitor — UI Mockup</title>
<style>
:root{
  --bg:#F5F7FA; --card:#FFFFFF; --cardHover:#F9FAFB;
  --edge:#D0D5DD; --text:#1A1D23; --hint:#5F6B7A;
  --accent:#3A86FF; --success:#34C759; --danger:#DA3633;
  --grayBtn:#C8CCD4; --grayBtnHover:#B8BBC1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#2a2d35;color:var(--text)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.device{width:800px;height:480px;background:var(--bg);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 0 8px #111;position:relative;overflow:hidden;user-select:none}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
button{font-family:inherit;cursor:pointer;border:none;outline:none;font-weight:700;transition:transform 0.1s,background 0.2s}
button:active{transform:scale(0.95)}
.btn{border-radius:8px;color:#fff;font-size:16px;padding:0 16px;height:48px}
.btn-success{background:var(--success)}
.btn-success:hover{background:#2D9A4F}
.btn-accent{background:var(--accent)}
.btn-accent:hover{background:#2563EB}
.btn-danger{background:var(--danger)}
.btn-danger:hover{background:#B02A27}
.btn-gray{background:var(--grayBtn);color:var(--text)}
.btn-gray:hover{background:var(--grayBtnHover)}
.btn-outline{background:transparent;border:2px solid var(--hint);color:var(--hint)}

/* Golf ball spinner */
.golf-ball{position:absolute;top:10px;left:10px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0%,#f0f0f0 40%,#d8d8d8 100%);box-shadow:inset -8px -8px 15px rgba(0,0,0,0.15),0 2px 6px rgba(0,0,0,0.3);z-index:200;overflow:hidden;animation:ballSpin 4s linear infinite}
.golf-ball::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 25% 25%,rgba(0,0,0,0.08) 1px,transparent 2px),radial-gradient(circle at 50% 25%,rgba(0,0,0,0.08) 1px,transparent 2px),radial-gradient(circle at 75% 25%,rgba(0,0,0,0.08) 1px,transparent 2px),radial-gradient(circle at 37% 50%,rgba(0,0,0,0.08) 1px,transparent 2px),radial-gradient(circle at 62% 50%,rgba(0,0,0,0.08) 1px,transparent 2px),radial-gradient(circle at 25% 75%,rgba(0,0,0,0.08) 1px,transparent 2px),radial-gradient(circle at 50% 75%,rgba(0,0,0,0.08) 1px,transparent 2px),radial-gradient(circle at 75% 75%,rgba(0,0,0,0.08) 1px,transparent 2px);background-size:100% 100%}
@keyframes ballSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* ===== HOME (swipe) ===== */
#home{overflow:hidden}
.swipe{width:1600px;height:480px;display:flex;transition:transform 0.35s ease}
.page{width:800px;height:480px;padding:14px;position:relative}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:100}
.dot{width:12px;height:12px;border-radius:6px;background:#C8CCD4;transition:background 0.2s}
.dot.active{background:var(--accent)}

/* Home Page 1 */
.home-top{display:flex;align-items:center;gap:12px;padding-left:60px;margin-bottom:12px}
.profile-label{font-size:18px;font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swipe-hint{color:var(--hint);font-size:13px;font-style:italic}
.nav-row{display:flex;gap:12px;margin-bottom:12px}
.nav-row button{flex:1;height:58px;border-radius:12px;font-size:18px}
.status-card{background:var(--card);border:2px solid var(--edge);border-radius:12px;height:64px;display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:12px}
.status-light{width:40px;height:40px;border-radius:50%;border:2px solid var(--text);background:var(--grayBtn);transition:background 0.3s}
.status-light.yellow{background:#FFD54F;animation:pulse 1.6s infinite}
.status-light.green{background:var(--success);animation:pulse 1.6s infinite}
.status-light.red{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.status-text{flex:1;font-size:16px;font-weight:700}
.club-card{background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:12px;margin-bottom:12px}
.club-card label{color:var(--hint);font-size:13px;font-weight:700;display:block;margin-bottom:10px;letter-spacing:0.5px}
.club-card select{width:100%;height:60px;padding:0 16px;font-size:18px;font-weight:700;color:var(--text);background:var(--bg);border:2px solid #E5E7EB;border-radius:10px;outline:none;font-family:inherit}
.club-card select:focus{border-color:var(--accent)}
.ready{height:40px;background:#E9F5E9;border:2px solid #C6E6C3;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px}
.ready-dot{width:14px;height:14px;border-radius:50%;background:var(--success)}
.ready-text{color:#1A5D1A;font-size:16px;font-weight:700}

/* Home Page 2 - Metrics */
.metrics-wrap{width:100%;height:100%;padding:16px}
.metrics-card{height:100%;background:var(--card);border:2px solid var(--edge);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.metrics-header{height:50px;background:var(--accent);display:flex;align-items:center;padding:0 16px;color:#fff}
.metrics-header .back-hint{font-size:13px;opacity:0.85;flex:1}
.metrics-header h2{font-size:20px;font-weight:700;letter-spacing:0.5px}
.metrics-header .spacer{flex:1}
.add-metric-btn{width:36px;height:36px;background:#fff;color:var(--accent);border-radius:8px;font-size:24px;opacity:0.95}
.metrics-grid{flex:1;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.metric{border-radius:12px;border:2px solid var(--edge);background:#F5F7FA;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:all 0.3s ease;cursor:pointer}
.metric .label{font-weight:700;color:var(--hint);letter-spacing:0.5px}
.metric .value{font-weight:700;color:var(--text);line-height:1}
.metric .unit{color:var(--hint)}
.metric.carry{background:#FFF8E1;border-color:#FFD54F}
.metric.carry .label{color:#F57F17}
.metric.carry .value{color:#E65100}
.metric.carry .unit{color:#F57F17}
.metric.total{background:#E8F5E9;border-color:#66BB6A}
.metric.total .label{color:#2E7D32}
.metric.total .value{color:#1B5E20}
.metric.total .unit{color:#2E7D32}
.simulate-btn{margin:0 14px 14px;height:70px;background:var(--accent);color:#fff;border-radius:14px;font-size:20px;font-weight:700;letter-spacing:0.5px}

/* ===== Generic sub-screens ===== */
.subscreen{padding:20px;height:100%;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.sub-header{display:flex;align-items:center;gap:12px;flex-shrink:0}
.sub-header h1{flex:1;text-align:center;font-size:24px;font-weight:700}
.sub-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:2px solid var(--edge);border-radius:10px;padding:15px}
.card-row{display:flex;align-items:center;gap:15px}
.card-row .lbl{font-size:18px;font-weight:700;flex:1}

/* Checkbox */
.cbox{width:24px;height:24px;border:2px solid var(--edge);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;transition:all 0.2s}
.cbox.on{background:var(--accent);border-color:var(--accent)}
.cbox.on::after{content:'✓';color:#fff;font-size:16px;font-weight:700}

/* ===== Dialogs ===== */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:500}
.overlay.show{display:flex}
.dialog{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:20px;max-width:90%;max-height:90%;display:flex;flex-direction:column;gap:15px}
.dialog.danger-border{border:3px solid var(--danger)}
.dialog.accent-border{border:3px solid var(--accent)}
.dialog.success-border{border:3px solid var(--success)}
.dialog h3{font-size:22px;font-weight:700}
.dialog p{color:var(--hint);font-size:14px;line-height:1.4}
.dialog-row{display:flex;gap:12px;margin-top:auto}
.dialog-row button{flex:1;height:48px}
.text-input{width:100%;height:50px;padding:0 14px;font-size:16px;background:var(--bg);border:2px solid var(--edge);border-radius:8px;outline:none;font-family:inherit;color:var(--text)}
.text-input:focus{border-color:var(--accent)}

/* ===== Toast ===== */
.toast{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:15px 25px;border-radius:10px;font-weight:700;font-size:15px;z-index:600;opacity:0;pointer-events:none;transition:opacity 0.3s}
.toast.show{opacity:1}

/* ===== Profile Screen ===== */
.profile-list{display:flex;flex-direction:column;gap:10px}
.profile-item{height:90px;background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:15px;display:flex;align-items:center;gap:15px;transition:border 0.2s}
.profile-item.active{border:3px solid var(--accent);padding:13px}
.avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;flex-shrink:0}
.profile-info{flex:1}
.profile-info .name{font-size:18px;font-weight:700}
.profile-info .meta{font-size:13px;color:var(--hint);margin-top:4px}
.profile-info .meta.active{color:#2D9A4F}
.profile-actions{display:flex;gap:8px}
.profile-actions button{height:40px;font-size:13px;padding:0 10px;border-radius:6px}
.icon-btn{width:40px;height:40px;border-radius:6px;background:transparent;border:2px solid;font-size:18px;padding:0}
.icon-btn.edit{border-color:var(--hint);color:var(--hint)}
.icon-btn.delete{border-color:var(--danger);color:var(--danger)}

/* ===== My Bag ===== */
.bag-header{background:var(--card);height:70px;padding:0 20px;display:flex;align-items:center;gap:15px}
.bag-header h1{flex:1;font-size:26px;font-weight:700}
.preset-row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);border-radius:10px;padding:10px;height:60px}
.preset-row .lbl{font-size:16px;font-weight:700}
.preset-row select{flex:1;height:40px;padding:0 12px;font-size:15px;font-weight:700;background:var(--bg);border:2px solid var(--edge);border-radius:6px;outline:none;font-family:inherit;color:var(--text)}
.clubs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.club-item{height:70px;background:var(--card);border:2px solid var(--edge);border-radius:10px;padding:15px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s}
.club-item:hover{background:var(--cardHover);border-color:var(--accent)}
.club-item .info{flex:1}
.club-item .info .cname{font-size:17px;font-weight:700}
.club-item .info .loft{font-size:14px;color:var(--hint);margin-top:4px}
.club-item .edit{color:var(--hint);font-size:13px;font-weight:700}
.club-item:hover .edit{color:var(--accent)}
.loft-editor{background:var(--bg);border:2px solid var(--accent);border-radius:10px;height:100px;display:flex;align-items:center;justify-content:center;gap:20px}
.loft-btn{width:50px;height:50px;border-radius:8px;font-size:28px;color:#fff}
.loft-value{font-size:40px;font-weight:700;min-width:120px;text-align:center}

/* ===== History ===== */
.history-table{flex:1;background:var(--card);border:2px solid var(--edge);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.history-head{height:50px;background:var(--card);border-bottom:2px solid var(--edge);display:grid;grid-template-columns:110px 70px 70px 65px 65px 55px 55px 55px 55px 55px;gap:3px;align-items:center;padding:0 10px;font-size:11px;font-weight:700;flex-shrink:0}
.history-body{flex:1;overflow-y:auto}
.history-row{height:45px;display:grid;grid-template-columns:110px 70px 70px 65px 65px 55px 55px 55px 55px 55px;gap:3px;align-items:center;padding:0 10px;font-size:11px}
.history-row:nth-child(even){background:#F9FAFB}
.history-row .ts{color:var(--hint);font-size:10px}
.history-empty{text-align:center;color:var(--hint);padding:40px;font-size:16px;white-space:pre-line}

/* ===== Calibration / Camera ===== */
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.preview-box{background:#000;border:2px solid var(--edge);border-radius:8px;height:240px;display:flex;align-items:center;justify-content:center;color:#5F6B7A;position:relative}
.preview-box .fps{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.7);color:#0f0;font-family:monospace;font-weight:700;padding:6px 10px;border-radius:4px;font-size:14px}
.preview-box .live{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);color:var(--success);font-weight:700;padding:6px 10px;border-radius:6px;font-size:14px}
.progress-bar{flex:1;height:12px;background:#E5E7EB;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--success);transition:width 0.3s}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}

/* ===== Add Metric Dialog ===== */
.metric-option{padding:10px;border-radius:8px;border:1px solid var(--edge);background:var(--bg);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 0.15s}
.metric-option.selected{background:#E8F0FE}
.metric-option .moname{flex:1;font-size:16px;font-weight:700}
.metric-option .mounit{font-size:13px;color:var(--hint)}

/* Scrollbar styling */
.sub-content::-webkit-scrollbar,.history-body::-webkit-scrollbar,.dialog ::-webkit-scrollbar{width:8px}
.sub-content::-webkit-scrollbar-thumb,.history-body::-webkit-scrollbar-thumb,.dialog ::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}

/* Hint below container */
.tipbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#8a8e95;font-size:12px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="golf-ball"></div>

  <!-- ====== HOME SCREEN ====== -->
  <div class="screen active" id="home">
    <div class="swipe" id="swipe">
      <!-- Page 1: Controls -->
      <div class="page" id="page1">
        <div class="home-top">
          <div class="profile-label" id="profileLabel">👤 No Profile</div>
          <div class="swipe-hint">Swipe for metrics →</div>
        </div>
        <div class="nav-row">
          <button class="btn-gray" onclick="openScreen('profile')">Profile</button>
          <button class="btn-gray" onclick="openScreen('settings')">Settings</button>
          <button class="btn-gray" onclick="openScreen('camera')">Camera</button>
          <button class="btn-gray" onclick="openScreen('history')">History</button>
        </div>
        <div class="nav-row">
          <button class="btn-success" style="flex:1;height:58px;border-radius:12px;font-size:18px" onclick="openScreen('calibration')">🧪 Calibration</button>
        </div>
        <div class="status-card">
          <div class="status-light" id="captureLight"></div>
          <div class="status-text" id="captureStatus">Not Started</div>
          <button class="btn-success" style="width:140px;height:50px;font-size:16px" onclick="startCapture()">Start Capture</button>
          <button class="btn-danger" style="width:100px;height:50px;font-size:16px" onclick="stopCapture()">Stop</button>
        </div>
        <div class="club-card">
          <label>CLUB SELECTION</label>
          <select id="clubSelect" onchange="onClubChange()"></select>
        </div>
        <div class="ready">
          <div class="ready-dot"></div>
          <div class="ready-text">Ready</div>
        </div>
      </div>
      <!-- Page 2: Metrics -->
      <div class="page" id="page2" style="padding:0">
        <div class="metrics-wrap">
          <div class="metrics-card">
            <div class="metrics-header">
              <div class="back-hint">← Swipe back</div>
              <h2>SHOT METRICS</h2>
              <div class="spacer"></div>
              <button class="add-metric-btn" onclick="openAddMetric()">+</button>
            </div>
            <div class="metrics-grid" id="metricsGrid"></div>
            <button class="simulate-btn" id="simBtn" onclick="simulateShot()">SIMULATE SHOT</button>
          </div>
        </div>
      </div>
    </div>
    <div class="dots">
      <div class="dot active" id="dot0" onclick="goPage(0)"></div>
      <div class="dot" id="dot1" onclick="goPage(1)"></div>
    </div>
  </div>

  <!-- Other screens inserted below -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>
  <!-- Overlay -->
  <div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
</div>
<div class="tipbar">800×480 · PRGR Launch Monitor mockup · tap anywhere in the metrics grid card to long-press and remove</div>
<script>
/* Placeholder — will be replaced in next chunks */
</script>
</body>
</html>
